[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.0"
description = "Security and quality scanner for Agent Skills (SKILL.md packages)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SkillGuard Contributors" }]
keywords = ["agent-skills", "security", "sast", "skill.md", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skillguard = "skillguard.cli:app"

[project.urls]
Homepage = "https://github.com/652036/skillguard"
Issues = "https://github.com/652036/skillguard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
