name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Clean example must pass
        run: skillguard scan examples/clean-review --fail-on high
      - name: Toxic example must fail
        run: |
          set +e
          skillguard scan examples/toxic-claw --fail-on high
          code=$?
          set -e
          test "$code" -eq 1
      - name: Rules command
        run: skillguard rules
