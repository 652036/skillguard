[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.1"
description = "Security and quality scanner for Agent Skills (SKILL.md packages)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "chen c", email = "652036@users.noreply.github.com" },
]
maintainers = [
    { name = "chen c", email = "652036@users.noreply.github.com" },
]
keywords = ["agent-skills", "security", "sast", "skill.md", "cli", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
skillguard = "skillguard.cli:app"

[project.urls]
Homepage = "https://github.com/652036/skillguard"
Repository = "https://github.com/652036/skillguard"
Issues = "https://github.com/652036/skillguard/issues"
Changelog = "https://github.com/652036/skillguard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skillguard"]

[tool.mypy]
python_version = "3.11"
packages = ["skillguard"]
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["skillguard"]
branch = true
