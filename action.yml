name: SkillGuard
description: Scan Agent Skills (SKILL.md packages) for security and quality issues
author: SkillGuard Contributors
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Path to a skill directory, a repo of skills, or a SKILL.md file
    required: false
    default: "."
  fail-on:
    description: Minimum severity that fails the job (critical, high, medium, low)
    required: false
    default: "high"
  disable:
    description: Comma-separated rule ids to skip (e.g. SG301,SG304)
    required: false
    default: ""
  enable:
    description: Allow-list of rule ids (comma-separated). Empty means all rules.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install SkillGuard
      shell: bash
      env:
        SKILLGUARD_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install -e "$SKILLGUARD_ACTION_PATH"
    - name: Scan skills
      shell: bash
      env:
        SKILLGUARD_PATH: ${{ inputs.path }}
        SKILLGUARD_FAIL_ON: ${{ inputs.fail-on }}
        SKILLGUARD_DISABLE: ${{ inputs.disable }}
        SKILLGUARD_ENABLE: ${{ inputs.enable }}
      run: |
        extra=()
        if [ -n "$SKILLGUARD_DISABLE" ]; then extra+=(--disable "$SKILLGUARD_DISABLE"); fi
        if [ -n "$SKILLGUARD_ENABLE" ]; then extra+=(--enable "$SKILLGUARD_ENABLE"); fi
        skillguard scan "$SKILLGUARD_PATH" --fail-on "$SKILLGUARD_FAIL_ON" "${extra[@]}"
